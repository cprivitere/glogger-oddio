name: Release

# Tag push v<semver> from main -> test gate, signed Windows NSIS build, GitHub
# Release on this fork, then refresh latest.json on the `updater-latest` pointer
# release (that tag URL is the updater endpoint compiled into the app, so it
# stays stable while the asset behind it is replaced on every release).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  REPO: ${{ github.repository }}
  CHANNEL_TAG: updater-latest

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build release installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true

      - name: Collect installer
        shell: bash
        run: |
          mkdir -p release-artifacts
          VERSION="$(echo "${GITHUB_REF_NAME}" | sed 's/^v//')"
          BUNDLE_DIR=$(find src-tauri/target -path "*/release/bundle" -type d 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "ERROR: no bundle dir"; find src-tauri/target -name bundle -type d; exit 1
          fi
          NAME="glogger-${VERSION}-windows-setup.exe"
          cp "$BUNDLE_DIR"/nsis/*.exe "release-artifacts/$NAME"
          SIG=$(ls "$BUNDLE_DIR"/nsis/*.exe.sig 2>/dev/null | head -1)
          if [ -z "$SIG" ]; then
            echo "ERROR: no .sig — the build was not signed (missing TAURI_SIGNING_PRIVATE_KEY secret?)"
            find "$BUNDLE_DIR" -type f
            exit 1
          fi
          cp "$SIG" "release-artifacts/$NAME.sig"
          ls -la release-artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-nsis
          path: release-artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release-nsis
          path: all-artifacts

      - name: Generate latest.json updater manifest
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(echo "$TAG" | sed 's/^v//')"
          NAME="glogger-${VERSION}-windows-setup.exe"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          if [ ! -f "all-artifacts/$NAME.sig" ]; then
            echo "ERROR: missing signature all-artifacts/$NAME.sig"; ls -la all-artifacts; exit 1
          fi
          SIG="$(cat "all-artifacts/$NAME.sig")"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          cat > all-artifacts/latest.json <<ENDJSON
          {
            "version": "${VERSION}",
            "notes": "glogger ${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "url": "${BASE_URL}/${NAME}",
                "signature": "${SIG}"
              }
            }
          }
          ENDJSON
          python3 -m json.tool all-artifacts/latest.json
          echo "verified: latest.json parses"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(echo "$TAG" | sed 's/^v//')"
          NAME="glogger-${VERSION}-windows-setup.exe"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"
          {
            echo "## Downloads"
            echo
            echo "| Platform | Installer |"
            echo "|----------|-----------|"
            echo "| **Windows** | [$NAME]($BASE_URL/$NAME) |"
            echo
            echo "---"
            echo
            echo "Installed builds auto-update from the \`$CHANNEL_TAG\` channel."
            echo
            echo "Original app by Daniel Auchenpaugh ([danielout/glogger](https://github.com/danielout/glogger)); build pipeline inherited from the [oddio fork](https://github.com/crisp-oddio/glogger-oddio). This fork is maintained by [cprivitere (TwinkleofToes)](https://github.com/cprivitere)."
          } > RELEASE_NOTES.md
          gh release create "$TAG" --repo "$REPO" --title "glogger $TAG" --notes-file RELEASE_NOTES.md --latest
          gh release upload "$TAG" all-artifacts/*.exe all-artifacts/*.sig --repo "$REPO"

      - name: Update the update-channel pointer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$CHANNEL_TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$CHANNEL_TAG" --repo "$REPO" \
              --title 'Update channel' --latest=false \
              --notes 'Pointer release: holds latest.json for the app updater endpoint. Replaced on every v* release — do not delete.'
          gh release upload "$CHANNEL_TAG" all-artifacts/latest.json --repo "$REPO" --clobber
          echo "channel updated: https://github.com/$REPO/releases/download/$CHANNEL_TAG/latest.json"
